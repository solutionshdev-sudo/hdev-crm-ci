# Hdev CRM — Deploy no EasyPanel (versão à prova de falha, na RAIZ do repo)
#
# Diferença pra versão antiga (hdevCRM/docker-compose.easypanel.yaml):
#   - Fica na RAIZ, então o .env que o EasyPanel cria cai do lado dele
#   - Cada serviço lê o .env via `env_file` (NÃO usa substituição ${...})
#     -> funciona independente do comportamento do EasyPanel
#
# No EasyPanel (serviço Compose):
#   - Build Path: /
#   - Docker Compose File: docker-compose.easypanel.yaml   (na raiz, sem hdevCRM/)
#   - Environment Variables: cola as 8 linhas (SECRET_KEY_BASE, senhas, SMTP)
#   - LIGA o toggle "Criar arquivo .env"  <-- OBRIGATÓRIO
#   - Implantar

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    env_file: [.env]                      # fornece POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    env_file: [.env]                      # fornece REDIS_PASSWORD
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data

  web:
    build:
      context: ./hdevCRM
      dockerfile: docker/Dockerfile
    image: hdev-crm:latest
    depends_on:
      - postgres
      - redis
    expose:
      - '3000'
    env_file: [.env]                      # SECRET_KEY_BASE, FRONTEND_URL, senhas, SMTP
    environment: &app_env
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      RAILS_LOG_TO_STDOUT: 'true'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: postgres
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379        # senha vem via REDIS_PASSWORD (do .env)
      ACTIVE_STORAGE_SERVICE: local
      INSTALLATION_NAME: 'Hdev CRM'
      BRAND_NAME: 'Hdev CRM'
      MAILER_SENDER_EMAIL: 'Hdev CRM <sac@hdev.online>'
    entrypoint: docker/entrypoints/rails.sh
    command: ["sh", "-c", "bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0"]
    volumes:
      - storage_data:/app/storage
    restart: always

  worker:
    build:
      context: ./hdevCRM
      dockerfile: docker/Dockerfile
    image: hdev-crm:latest
    depends_on:
      - postgres
      - redis
    env_file: [.env]
    environment:
      <<: *app_env
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - storage_data:/app/storage
    restart: always

volumes:
  postgres_data:
  redis_data:
  storage_data:
