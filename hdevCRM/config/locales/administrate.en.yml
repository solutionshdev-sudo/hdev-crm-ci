# O gem administrate embarca as chaves padrão (actions, form, fields, filters,
# sidebar...) em inglês nativamente. "values.status" é uma chave CUSTOM desta
# app (usada pelos lambdas de AgencyDashboard/AccountDashboard) que nunca
# ganhou tradução em inglês — em :en caía em "translation missing". Fechado
# aqui, ao lado da irmã pt_BR em administrate.pt_BR.yml.
en:
  administrate:
    values:
      status:
        active: Active
        suspended: Suspended
        pending_payment: Pending payment
      plan_type:
        direct: Direct
        agency: Agency
      subscription_status:
        pending: Pending
        active: Active
        past_due: Past due
        canceled: Canceled
    # Hint nativo do gem: o _form.html.erb do próprio administrate procura
    # "administrate.field_hints.<resource>.<attribute>" e renderiza em
    # .field-unit__hint quando a chave existe (ver _form.html.erb no gem).
    field_hints:
      agency:
        suspended_reason: >-
          Manual suspension for abuse must come with canceling the
          subscription in Stripe — the next invoice.paid will reactivate the
          agency.
      plan:
        channel_limits_json: >-
          JSON with a cap per channel type, e.g. {"Channel::Whatsapp": 1}.
          Missing key or null = unlimited. Empty limits are unlimited too.
      subscription:
        status: >-
          Manual status changes bypass Stripe — use only for courtesy or to
          fix drift. Suspension for abuse must also cancel the subscription
          in Stripe, or the next invoice.paid reactivates the owner.
