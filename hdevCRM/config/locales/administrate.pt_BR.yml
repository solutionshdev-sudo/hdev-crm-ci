# Tradução pt-BR do Administrate (Super Admin). O gem só embarca a chave
# "pt-BR" (com hífen); o app roda com :pt_BR, então as chaves vivem aqui.
pt_BR:
  administrate:
    actions:
      back: Voltar
      confirm: Tem certeza?
      destroy: Excluir
      edit: Editar
      edit_resource: Editar %{name}
      show_resource: Detalhes de %{name}
      new_resource: Novo(a) %{name}
    controller:
      create:
        success: '%{resource} criado(a) com sucesso.'
      destroy:
        success: '%{resource} excluído(a) com sucesso.'
      update:
        success: '%{resource} atualizado(a) com sucesso.'
    fields:
      has_many:
        more: 'Mostrando %{count} de %{total_count}'
        none: Nenhum
      has_one:
        none: Nenhum
      polymorphic:
        none: Nenhum
      # Gem administrate-field-active_storage (botões do campo de anexo)
      active_storage:
        add: Adicionar
        replace: Substituir
        remove: Remover
    form:
      error: erro
      errors: '%{pluralized_errors} impediram que este(a) %{resource_name} fosse salvo(a):'
    search:
      clear: Limpar busca
      label: Buscar %{resource}
    # Nomes dos COLLECTION_FILTERS dos dashboards (o partial _filters.html.erb
    # consulta administrate.filters.<nome> com fallback pro titleize inglês).
    filters:
      active: Ativas
      suspended: Suspensas
      marked_for_deletion: Marcadas pra exclusão
      recent: Recentes
      confirmed: Confirmados
      unconfirmed: Não confirmados
      super_admin: Super admins
      open: Abertos
      user: Usuário
      agent_bot: Robô de agente
      platform_app: App de plataforma
      direct: Diretos
      agency: De agência
    sidebar:
      collapse: Recolher menu
      expand: Expandir menu
    # Valores de selects/enums dos dashboards (consultados via lambda em runtime)
    values:
      status:
        active: Ativa
        suspended: Suspensa
        pending_payment: Aguardando pagamento
      plan_type:
        direct: Direto
        agency: Agência
      banner_type:
        info: Informativo
        warning: Aviso
        error: Erro
      role:
        agent: Agente
        administrator: Administrador
    # Hint nativo do gem: o _form.html.erb do próprio administrate procura
    # "administrate.field_hints.<resource>.<attribute>" e renderiza em
    # .field-unit__hint quando a chave existe (ver _form.html.erb no gem).
    field_hints:
      agency:
        suspended_reason: >-
          Suspensão manual por abuso deve vir acompanhada do cancelamento da
          assinatura no Stripe — o próximo invoice.paid reativa a agência.
      plan:
        channel_limits_json: >-
          JSON com teto por tipo de canal, ex: {"Channel::Whatsapp": 1}.
          Chave ausente ou null = ilimitado. Limites vazios também são
          ilimitados.
  helpers:
    submit:
      create: 'Criar %{model}'
      update: 'Salvar %{model}'
      submit: 'Salvar %{model}'
    # Cabeçalhos de coluna e rótulos por recurso. As views do Administrate
    # consultam helpers.label.<recurso>.<atributo> ANTES do fallback
    # human_attribute_name — sem essas chaves o índice fica em inglês.
