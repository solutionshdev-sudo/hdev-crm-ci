# Dívida de estilo herdada, congelada pela primeira rodada do CI (2026-07-28).
# Gerado a partir das 67 ofensas que o rubocop apontou no primeiro run — o objetivo
# é o gate valer pra código NOVO em vez de ficar vermelho por débito antigo.
#
# 33 delas são autocorrigíveis: rodar "bundle exec rubocop -a" no container e
# regerar este arquivo derruba a lista de uma vez. As Metrics/* pedem refatoração
# de verdade e podem ficar aqui.

